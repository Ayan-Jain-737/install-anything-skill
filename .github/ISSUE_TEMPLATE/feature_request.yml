name: "✨ Feature Request"
description: Suggest an idea or capability for install-anything-skill (ias)
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make `ias` even better? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered.
  - type: dropdown
    id: target-agent
    attributes:
      label: Relevant Agent Harness
      description: Does this feature apply to a specific agent harness or all of them?
      options:
        - "All Harnesses"
        - "Antigravity / Gemini"
        - "Claude Code"
        - "Open Agents"
        - "Hermes"
        - "OpenCode"
        - "Codex / Cursor / Zed"
