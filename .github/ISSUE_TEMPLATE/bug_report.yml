name: "🐛 Bug Report"
description: File a bug report to help us improve install-anything-skill (ias)
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so we can diagnose and fix it quickly.
  - type: input
    id: version
    attributes:
      label: ias Version
      description: What version of ias are you running? (Run `ias --help` or check npm package version)
      placeholder: "e.g. 2.0.0"
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: AI Agent Harness
      description: Which agent harness were you using?
      options:
        - "Antigravity / Gemini"
        - "Claude Code"
        - "Open Agents (npx skills)"
        - "Hermes"
        - "OpenCode"
        - "Codex"
        - "Cursor"
        - "Zed"
        - "Standalone CLI / Terminal"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System & Node.js Version
      placeholder: "e.g. Ubuntu 24.04, macOS 14.5, Node v20.12.0"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact Command Executed
      placeholder: "e.g. ias install https://github.com/user/repo"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Terminal Output
      description: Paste any terminal logs or stack traces here.
      render: shell
